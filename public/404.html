<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legacy Lau Gar | Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/x-icon" href="/images/dragonFavicon.ico" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #121212;
        color: #ededed;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      p.code {
        margin: 0;
        letter-spacing: 0.2em;
        font-weight: 700;
        color: #ffd700;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.8rem 1.4rem;
        border-radius: 8px;
        background: #ffd700;
        color: #121212;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist or has moved.</p>
    <a href="/">Back to home</a>
  </body>
</html>
